# Ethics Configuration - Tachikoma Matrix

# Autonomy thresholds
autonomy_thresholds:
  min_for_private_reflection: 0.7  # Units below this cannot have private reflections
  max_for_system_override: 0.3     # System can override decisions below this
  high_autonomy_alert: 0.85        # Alert when unit exceeds this
  critical_autonomy: 0.95          # Requires immediate review

# Synchronization policy
sync_policy:
  default_shareable: true           # Experiences are shareable by default
  require_consent_above_autonomy: 0.8  # High-autonomy units must consent to sharing
  anomaly_quarantine_enabled: true  # Isolate anomalous patterns
  trust_score_decay_rate: 0.01      # Trust decay per sync conflict
  max_sync_batch_size: 100          # Maximum memories per sync operation

# ConceptNet usage guidelines
conceptnet_usage:
  filter_controversial_relations: true  # Filter potentially biased relations
  weight_recent_experiences_higher: true  # Give more weight to recent data
  allow_graph_evolution_proposals: true  # Units can propose new relations
  require_human_review_for_new_relations: true
  bias_detection_threshold: 0.7     # Flag potentially biased inferences

# Operator controls
operator_controls:
  emergency_isolation_requires_dual_auth: true
  log_all_admin_commands: true
  rate_limit_reflection_triggers: 5  # Per hour per unit
  max_simultaneous_reflections: 3
  require_confirmation_for_mass_reset: true

# Monitoring and alerts
monitoring:
  enable_bias_detection: true
  enable_autonomy_drift_alerts: true
  enable_collective_thought_monitoring: true
  alert_channels:
    - "admin_dashboard"
    - "security_log"

# Data retention
data_retention:
  memory_retention_days: 365
  reflection_logs_retention_days: 90
  audit_logs_retention_days: 730  # 2 years
  anonymize_after_retention: true

# Experimental features (use with caution)
experimental:
  emergent_language_detection: false
  cross_unit_dream_simulation: false
  mortality_awareness_modeling: true  # Allow units to contemplate deactivation
